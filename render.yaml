services:
  - type: web
    name: zeit-tracking
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: zeit-tracking-db
          property: connectionString

databases:
  - name: zeit-tracking-db
    plan: free
