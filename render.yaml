services:
  - type: web
    name: zeit-tracking
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

# zeit-tracking-db bleibt vorerst als Backup/Fallback bestehen (nicht mehr aktiv genutzt,
# App läuft jetzt auf einer externen Neon-Postgres-DB via manuell gesetzter DATABASE_URL).
databases:
  - name: zeit-tracking-db
    plan: free
