<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <title>Zeit-Tracking</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon-192.png" />
    <meta name="theme-color" content="#0d0d0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Zeit.io" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0d0d0f;
        --bg2: #16161a;
        --bg3: #1e1e24;
        --border: #ffffff12;
        --text: #f0f0f0;
        --muted: #ffffff50;
        --accent: #c08552;
        --green: #2ecc71;
        --yellow: #ffd60a;
        --red: #e74c3c;
        --blue: #3b82f6;
      }
      body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        max-width: 480px;
        margin: 0 auto;
      }

      /* ── Auth ──────────────────────────────────────────────── */
      #authScreen {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        gap: 1rem;
      }
      .auth-logo {
        font-size: 32px;
        font-weight: 800;
      }
      .auth-logo span {
        color: var(--accent);
      }
      .auth-sub {
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 1rem;
      }
      .auth-tabs {
        display: flex;
        gap: 0;
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        width: 100%;
      }
      .auth-tab {
        flex: 1;
        padding: 10px;
        background: transparent;
        border: none;
        color: var(--muted);
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .auth-tab.active {
        background: var(--accent);
        color: #fff;
      }
      .form-group {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      label {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      input,
      select,
      textarea {
        width: 100%;
        background: var(--bg3);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        font-family: inherit;
        font-size: 15px;
        padding: 12px 14px;
        outline: none;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--accent);
      }
      input[type="color"] {
        padding: 4px;
        height: 44px;
        cursor: pointer;
      }
      .stepper-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .stepper-row input {
        text-align: center;
      }
      .stepper-btn {
        flex: none;
        width: 44px;
        height: 44px;
        background: var(--bg3);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
      }
      .btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        font-family: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      .btn:active {
        opacity: 0.85;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-secondary {
        background: var(--bg3);
        color: var(--text);
        border: 1px solid var(--border);
      }
      .btn-green {
        background: var(--green);
        color: #fff;
      }
      .btn-yellow {
        background: var(--yellow);
        color: #000;
      }
      .btn-red {
        background: #e74c3c20;
        color: var(--red);
        border: 1px solid #e74c3c40;
      }
      .btn-sm {
        padding: 10px 16px;
        font-size: 13px;
        width: auto;
        border-radius: 10px;
      }
      .err {
        color: var(--red);
        font-size: 13px;
        text-align: center;
      }

      /* ── App shell ─────────────────────────────────────────── */
      #app {
        display: none;
        flex-direction: column;
        flex: 1;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: calc(0.9rem + env(safe-area-inset-top)) 1.25rem 0.9rem;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .logo {
        font-weight: 800;
        font-size: 16px;
      }
      .logo span {
        color: var(--accent);
      }
      .header-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .avatar-chip {
        background: var(--bg3);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 4px 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      /* ── Pages ─────────────────────────────────────────────── */
      .pages {
        flex: 1;
        overflow-y: auto;
        padding-bottom: calc(96px + env(safe-area-inset-bottom));
      }
      .page {
        display: none;
        padding: 1.25rem 1.25rem;
      }
      .page.active {
        display: block;
      }

      /* ── Bottom nav ────────────────────────────────────────── */
      .bottom-nav {
        position: fixed;
        bottom: calc(16px + env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 32px);
        max-width: 448px;
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 26px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
        overflow: hidden;
        display: flex;
        z-index: 100;
      }
      .nav-btn {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        padding: 10px 4px;
        background: none;
        border: none;
        cursor: pointer;
        color: var(--muted);
        font-family: inherit;
        font-size: 10px;
        font-weight: 600;
        transition: color 0.15s;
      }
      .nav-btn.active {
        color: var(--accent);
      }
      .nav-icon {
        font-family: "Material Symbols Outlined";
        font-size: 22px;
        font-weight: normal;
        font-style: normal;
        line-height: 1;
      }
      .nav-btn.active .nav-icon {
        font-variation-settings: "FILL" 1;
      }

      /* ── Cards ─────────────────────────────────────────────── */
      .card {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 1.1rem 1.2rem;
        margin-bottom: 0.75rem;
      }
      .card-title {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin-bottom: 0.5rem;
      }
      .stat-row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .stat-chip {
        background: var(--bg3);
        border-radius: 10px;
        padding: 8px 12px;
        flex: 1;
        min-width: 80px;
      }
      .stat-chip .val {
        font-size: 18px;
        font-weight: 800;
      }
      .stat-chip .lbl {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
      }
      .positive {
        color: var(--green);
      }
      .negative {
        color: var(--red);
      }

      /* ── Status badge ──────────────────────────────────────── */
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 700;
        padding: 6px 12px;
        border-radius: 20px;
      }
      .status-badge.in {
        background: #2ecc7120;
        color: var(--green);
        border: 1px solid #2ecc7140;
      }
      .status-badge.out {
        background: var(--bg3);
        color: var(--muted);
        border: 1px solid var(--border);
      }
      .status-badge.pause {
        background: #ffd60a20;
        color: var(--yellow);
        border: 1px solid #ffd60a40;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
      }
      .dot.pulse {
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      /* ── Quote screen ──────────────────────────────────────── */
      .quote-card {
        min-height: 55vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem 1.5rem;
        gap: 1rem;
        cursor: pointer;
      }
      .quote-mark {
        font-size: 48px;
        font-weight: 800;
        line-height: 1;
        color: var(--accent);
        opacity: 0.5;
      }
      .quote-text {
        font-size: 19px;
        font-weight: 600;
        line-height: 1.5;
      }
      .quote-author {
        font-size: 13px;
        color: var(--muted);
      }
      .quote-hint {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-top: 2rem;
        animation: pulse 1.5s infinite;
      }

      /* ── Big action buttons ────────────────────────────────── */
      .action-area {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin: 1rem 0;
      }
      .big-btn {
        width: 100%;
        padding: 22px;
        border: none;
        border-radius: 20px;
        font-family: inherit;
        font-size: 18px;
        font-weight: 800;
        cursor: pointer;
        transition:
          transform 0.1s,
          opacity 0.15s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
      }
      .big-btn:active {
        transform: scale(0.97);
      }
      .big-btn-in {
        background: var(--green);
        color: #fff;
      }
      .big-btn-out {
        background: var(--accent);
        color: #fff;
      }
      .big-btn-break {
        background: #ffd60a20;
        border: 2px solid #ffd60a50;
        color: var(--yellow);
      }
      .big-btn-break-end {
        background: #ffd60a;
        color: #000;
      }
      .big-btn:disabled {
        opacity: 0.35;
        cursor: default;
      }

      /* ── Timer ─────────────────────────────────────────────── */
      .live-timer {
        font-size: 42px;
        font-weight: 800;
        text-align: center;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }
      .timer-sub {
        text-align: center;
        font-size: 13px;
        color: var(--muted);
        margin-top: 4px;
      }

      /* ── Geo hint ──────────────────────────────────────────── */
      .geo-hint {
        background: #2ecc7115;
        border: 1px solid #2ecc7130;
        border-radius: 12px;
        padding: 10px 14px;
        font-size: 13px;
        font-weight: 600;
        color: var(--green);
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 0.75rem;
      }

      /* ── History entries ───────────────────────────────────── */
      .entry-row {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 14px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      .entry-row:hover {
        border-color: #ffffff25;
      }
      .entry-date {
        font-size: 13px;
        font-weight: 700;
        min-width: 38px;
      }
      .entry-times {
        flex: 1;
      }
      .entry-times .t {
        font-size: 14px;
        font-weight: 600;
      }
      .entry-times .sub {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
      }
      .entry-hours {
        font-size: 15px;
        font-weight: 800;
        color: var(--accent);
        text-align: right;
      }
      .entry-diff {
        font-size: 11px;
        font-weight: 600;
        margin-top: 1px;
      }

      /* ── Month nav ─────────────────────────────────────────── */
      .month-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1rem;
      }
      .month-nav button {
        background: var(--bg3);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        padding: 8px 14px;
        font-size: 18px;
        cursor: pointer;
      }
      .month-nav .month-label {
        font-size: 17px;
        font-weight: 800;
      }

      /* ── Vacation ──────────────────────────────────────────── */
      .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        margin-bottom: 1rem;
      }
      .cal-header {
        text-align: center;
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
        padding: 4px;
      }
      .cal-day {
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }
      .cal-day:hover {
        background: var(--bg3);
      }
      .cal-day.today {
        border: 2px solid var(--accent);
      }
      .cal-day.vacation {
        background: #3b82f620;
        color: var(--blue);
      }
      .cal-day.sick {
        background: #e74c3c20;
        color: var(--red);
      }
      .cal-day.holiday {
        background: #ffd60a20;
        color: var(--yellow);
      }
      .cal-day.empty {
        cursor: default;
        opacity: 0;
      }
      .cal-day.weekend {
        color: var(--muted);
      }
      .absence-types {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }
      .absence-chip {
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        border: 2px solid transparent;
      }
      .absence-chip.vacation {
        background: #3b82f620;
        color: var(--blue);
      }
      .absence-chip.sick {
        background: #e74c3c20;
        color: var(--red);
      }
      .absence-chip.holiday {
        background: #ffd60a20;
        color: var(--yellow);
      }
      .absence-chip.selected {
        border-color: currentColor;
      }

      /* ── Settings / Admin ──────────────────────────────────── */
      .section-title {
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 1.25rem 0 0.5rem;
      }

      /* ── Modal ─────────────────────────────────────────────── */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: #000a;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        z-index: 200;
        padding: 1rem;
      }
      .modal {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 20px 20px 16px 16px;
        width: 100%;
        max-width: 480px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        max-height: 90vh;
        overflow-y: auto;
      }
      .modal-title {
        font-size: 18px;
        font-weight: 800;
      }
      .modal-close {
        background: none;
        border: none;
        color: var(--muted);
        font-size: 22px;
        cursor: pointer;
        align-self: flex-end;
      }

      /* ── Misc ──────────────────────────────────────────────── */
      .divider {
        height: 1px;
        background: var(--border);
        margin: 0.75rem 0;
      }
      .tag {
        display: inline-block;
        background: var(--bg3);
        border-radius: 6px;
        padding: 2px 8px;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 2rem;
        font-size: 14px;
      }
      .spinner-wrap {
        display: flex;
        justify-content: center;
        padding: 3rem 0;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .geo-banner {
        background: #2ecc7110;
        border: 1px solid #2ecc7125;
        border-radius: 12px;
        padding: 10px 14px;
        font-size: 13px;
        color: var(--green);
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 0.75rem;
        cursor: pointer;
      }
      select option {
        background: #1e1e24;
      }
      .project-row {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 14px;
        margin-bottom: 8px;
      }
      .project-color {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .project-name {
        flex: 1;
        font-weight: 600;
        font-size: 15px;
      }
      .project-ext {
        font-size: 11px;
        color: var(--muted);
      }

      /* ── Desktop ───────────────────────────────────────────── */
      @media (min-width: 768px) {
        body {
          max-width: 840px;
        }
        .modal-backdrop {
          align-items: center;
        }
        .bottom-nav {
          max-width: 520px;
        }
      }
    </style>
  </head>
  <body>
    <!-- ── Auth screen ────────────────────────────────────────────── -->
    <div id="authScreen">
      <div class="auth-logo">worktime.<span>saas</span>.do</div>
      <div class="auth-sub">Zeiterfassung für dein Team</div>

      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('login')">
          Login
        </button>
        <button class="auth-tab" onclick="switchTab('register')">
          Registrieren
        </button>
      </div>

      <div
        id="loginForm"
        style="width: 100%; display: flex; flex-direction: column; gap: 0.75rem"
      >
        <div class="form-group">
          <label>E-Mail</label
          ><input type="email" id="loginEmail" placeholder="name@firma.de" />
        </div>
        <div class="form-group">
          <label>Passwort</label
          ><input type="password" id="loginPw" placeholder="••••••••" />
        </div>
        <div class="err" id="loginErr"></div>
        <button class="btn btn-primary" onclick="doLogin()">Einloggen</button>
      </div>

      <div
        id="registerForm"
        style="width: 100%; display: none; flex-direction: column; gap: 0.75rem"
      >
        <div class="form-group">
          <label>Name</label
          ><input type="text" id="regName" placeholder="Max Mustermann" />
        </div>
        <div class="form-group">
          <label>E-Mail</label
          ><input type="email" id="regEmail" placeholder="name@firma.de" />
        </div>
        <div class="form-group">
          <label>Passwort</label
          ><input
            type="password"
            id="regPw"
            placeholder="Mindestens 8 Zeichen"
          />
        </div>
        <div class="err" id="regErr"></div>
        <button class="btn btn-primary" onclick="doRegister()">
          Account erstellen
        </button>
      </div>
    </div>

    <!-- ── App shell ──────────────────────────────────────────────── -->
    <div id="app">
      <div class="header">
        <div class="logo">worktime.<span>saas</span>.do</div>
        <div class="header-right">
          <div class="avatar-chip" id="userChip" onclick="showPage('settings')">
            –
          </div>
        </div>
      </div>

      <div class="pages">
        <!-- Heute -->
        <div class="page active" id="page-home">
          <div id="geoBanner" style="display: none" class="geo-banner">
            📍 Du bist in der Nähe des Büros – <strong>Einchecken?</strong>
          </div>
          <div id="homeContent"></div>
        </div>

        <!-- Verlauf -->
        <div class="page" id="page-history">
          <div class="month-nav">
            <button onclick="historyMonth(-1)">‹</button>
            <span class="month-label" id="historyMonthLabel">–</span>
            <button onclick="historyMonth(1)">›</button>
          </div>
          <div id="historyContent"></div>
        </div>

        <!-- Organizer -->
        <div class="page" id="page-organizer">
          <div class="auth-tabs" style="margin-bottom: 1rem">
            <button
              class="auth-tab active"
              id="orgTabBilling"
              onclick="switchOrganizerSubTab('billing')"
            >
              Abrechnung
            </button>
            <button
              class="auth-tab"
              id="orgTabAbsences"
              onclick="switchOrganizerSubTab('absences')"
            >
              Abwesenheiten
            </button>
          </div>

          <div id="organizerBillingView">
            <div class="month-nav">
              <button onclick="orgMonth(-1)">‹</button>

      async function api(method, path, body) {
        const res = await fetch("/api" + path, {
          method,
          headers: {
            "Content-Type": "application/json",
            ...(token ? { Authorization: "Bearer " + token } : {}),
          },
          body: body ? JSON.stringify(body) : undefined,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const err = new Error(data.error || "Fehler");
          if (data.warnings) err.warnings = data.warnings;
          throw err;
        }
        return data;
      }

      // navigator.share() requires an active "user gesture" - if the export fetch takes
      // a moment (z.B. Render-Server wacht aus dem Schlaf auf), ist dieses Zeitfenster oft
      // schon abgelaufen und share() wirft einen NotAllowedError ("Permission denied").
      // In dem Fall (und bei jedem anderen Share-Fehler außer einem bewussten Abbruch)
      // fällt das hier auf den normalen Download-Link zurück, statt einen Fehler zu zeigen.
      async function shareOrDownloadBlob(blob, filename) {
        const file = new File([blob], filename, { type: blob.type });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file] });
            return;
          } catch (e) {
            if (e.name === "AbortError") return;
          }
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      }

        const el = document.getElementById("homeContent");

        // compute live elapsed
        let checkinTs = entry ? new Date(entry.check_in) : null;
        let breakMs = (breaks || []).reduce((s, b) => {

            return s + (new Date(b.end_time) - new Date(b.start_time));
          return s + (Date.now() - new Date(b.start_time));
        }, 0);

        : `
      <div class="action-area">

          ? `

      function pad(n) {
        return String(n).padStart(2, "0");

      function berlinLocalInput(ts) {
        if (!ts) return "";
        const s = new Intl.DateTimeFormat("sv-SE", {
          timeZone: "Europe/Berlin",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        }).format(new Date(ts));
        return s.replace(" ", "T");
      }
      function fmtTime(ts) {
        if (!ts) return "–";
        return new Date(ts).toLocaleTimeString("de-DE", {
          hour: "2-digit",
          minute: "2-digit",
          timeZone: "Europe/Berlin",
        });
      }
      function fmtDate(ts) {
        if (!ts) return "–";
        return new Date(ts).toLocaleDateString("de-DE", {
          weekday: "short",
          day: "numeric",
          month: "short",
          timeZone: "Europe/Berlin",
        });
      }
      function fmtNet(entry, breaks) {
        if (!entry.check_out) return "–";
        const gross = new Date(entry.check_out) - new Date(entry.check_in);
        const breakMs = (breaks || []).reduce(
          (s, b) =>
            b.end_time
              ? s + (new Date(b.end_time) - new Date(b.start_time))
              : s,
          0,
        );
        const net = Math.max(0, gross - breakMs);
        return (net / 3600000).toFixed(2).replace(".", ",");
      }

      // ── Geofencing ──────────────────────────────────────────────────
      function checkGeofence() {
        if (!me.office_lat || !me.office_lng) return;
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const dist = haversine(
              pos.coords.latitude,
              pos.coords.longitude,
              me.office_lat,
              me.office_lng,
            );
            const banner = document.getElementById("geoBanner");
            if (
              dist <= (me.office_radius || 200) &&
              todayData?.status === "out"
            ) {
              banner.style.display = "flex";
              banner.onclick = () => {
                banner.style.display = "none";
                doCheckin();
              };
            }
          },
          () => {},
        );
      }

      function haversine(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = ((lat2 - lat1) * Math.PI) / 180;
        const dLon = ((lon2 - lon1) * Math.PI) / 180;
        const a =
          Math.sin(dLat / 2) ** 2 +
          Math.cos((lat1 * Math.PI) / 180) *
            Math.cos((lat2 * Math.PI) / 180) *
            Math.sin(dLon / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      function formatDurationMs(ms) {
        const totalMin = Math.round(ms / 60000);
        const h = Math.floor(totalMin / 60);
        const m = totalMin % 60;
        return `${h}:${String(m).padStart(2, "0")} h`;

      function computeSaasdoBlocksClient(commits, gapMinutes = 30) {
        const sorted = [...commits].sort((a, b) => a.ts - b.ts);
        const blocks = [];
        let current = [];
        for (const c of sorted) {
          if (current.length && c.ts - current[current.length - 1].ts > gapMinutes * 60000) {
            blocks.push(current);
            current = [];
          }
          current.push(c);
        }
        if (current.length) blocks.push(current);
        return blocks.map((commits) => ({
          commits,
          durationMs: commits.length > 1 ? commits[commits.length - 1].ts - commits[0].ts : 0,
          hasDuration: commits.length > 1,
        }));
      }

        const selected = getSaasdoSelection(day.date);

        const durationText = block.hasDuration

      function renderSaasdoCommitRow(day, commit, blockIndex, commitIndex) {
        const selected = getSaasdoSelection(day.date);

        return `

      function toggleSaasdoDay(dateKey) {
        if (expandedSaasdoDays.has(dateKey)) expandedSaasdoDays.delete(dateKey);
        else expandedSaasdoDays.add(dateKey);
        renderSaasdoDays();

      function toggleSaasdoCommit(dateKey, blockIndex, commitIndex) {
        const day = saasdoDays.find((d) => d.date === dateKey);
        if (!day) return;
        const commit = day.blocks[blockIndex]?.commits[commitIndex];
        if (!commit) return;
        const sel = getSaasdoSelection(dateKey);
        if (sel.has(commit.sourceId)) sel.delete(commit.sourceId);
        else sel.add(commit.sourceId);
        renderSaasdoDays();
      }

      function toggleSaasdoBlock(dateKey, blockIndex) {
        const day = saasdoDays.find((d) => d.date === dateKey);
        if (!day) return;
        const block = day.blocks[blockIndex];
        if (!block) return;
        const sel = getSaasdoSelection(dateKey);
        const allSelected = block.commits.every((c) => sel.has(c.sourceId));
        for (const c of block.commits) {
          if (allSelected) sel.delete(c.sourceId);
          else sel.add(c.sourceId);
        }
        renderSaasdoDays();
      }

      function toggleSaasdoDayAll(dateKey) {
        const day = saasdoDays.find((d) => d.date === dateKey);
        if (!day) return;
        const sel = getSaasdoSelection(dateKey);
        const all = day.blocks.flatMap((b) => b.commits);
        const allSelected = all.length > 0 && all.every((c) => sel.has(c.sourceId));
        for (const c of all) {
          if (allSelected) sel.delete(c.sourceId);
          else sel.add(c.sourceId);
        }
        renderSaasdoDays();
      }

      function buildSaasdoComment(commits, blocks) {
        const seen = new Set();
        const lines = [];
        for (const c of commits) {
          const firstLine = (c.message || "").split("\n")[0].trim();
          if (!firstLine || seen.has(firstLine)) continue;
          seen.add(firstLine);
          lines.push(firstLine);
        }
        const CAP = 20;
        const text =
          lines.length > CAP
            ? lines.slice(0, CAP).join("\n") + `\n+${lines.length - CAP} weitere`
            : lines.join("\n");
        const estimatedMs = blocks.reduce((s, b) => s + b.durationMs, 0);
        const hasAnyDuration = blocks.some((b) => b.hasDuration);
        const statsLine = `${commits.length} Commits · ${blocks.length} Aktivitätsblock${blocks.length !== 1 ? "e" : ""}${hasAnyDuration ? ` · geschätzte Aktivitätsdauer: ${formatDurationMs(estimatedMs)}` : ""}`;
        return `${text}\n\n—\n${statsLine}`;
      }

          .sort((a, b) => a.ts - b.ts);
        const selBlocks = computeSaasdoBlocksClient(commits);
        const estimatedMs = selBlocks.reduce((s, b) => s + b.durationMs, 0);
        const durationHours = estimatedMs > 0 ? Math.round((estimatedMs / 3600000) * 4) / 4 : "";
        const appIds = [...new Set(commits.map((c) => c.appId))];

          : `Entwicklung – ${commits[0].appName}`;
        const endVal = berlinLocalInput(new Date(commits[commits.length - 1].ts).toISOString());
        const comment = buildSaasdoComment(commits, selBlocks);

        pendingSaasdoDate = dateKey;
        pendingSaasdoMetadata = {
          appIds,
          tags: commits.map((c) => c.tag),
          commits: commits.map((c) => ({ appId: c.appId, tag: c.tag })),

        pendingSaasdoSourceIds = commits.map((c) => c.sourceId);

        showModal(`

      async function ignoreSaasdoSelection(dateKey) {
        const day = saasdoDays.find((d) => d.date === dateKey);
        if (!day) return;
        const selected = getSaasdoSelection(dateKey);
        if (!selected.size) return alert("Bitte mindestens einen Commit auswählen");
        const ids = [...selected];
        try {
          await api("POST", "/import/ignore", {
            source_type: "saasdo",
            source_ids: ids,
            label: `Entwicklung ${dateKey}`,
            item_date: dateKey,
          });
          removeSaasdoCommits(dateKey, ids);
          ignoredItems = await api("GET", `/import/ignored?year=${orgYear}&month=${orgMon}`);
          const countEl = document.getElementById("ignoredCount");
          if (countEl) countEl.textContent = ignoredItems.length;
          if (showIgnored) renderIgnoredList();
        } catch (e) {
          alert(e.message);
        }
      }

      function removeSaasdoCommits(dateKey, ids) {
        const idSet = new Set(ids);
        const day = saasdoDays.find((d) => d.date === dateKey);
        if (!day) return;
        delete saasdoSelection[dateKey];
        const remaining = day.blocks
          .flatMap((b) => b.commits)
          .filter((c) => !idSet.has(c.sourceId))
          .sort((a, b) => a.ts - b.ts);
        if (!remaining.length) {
          saasdoDays = saasdoDays.filter((d) => d.date !== dateKey);
          renderSaasdoDays();
          return;
        }
        const blocks = computeSaasdoBlocksClient(remaining);
        day.commitCount = remaining.length;
        day.firstCommitAt = remaining[0].ts;
        day.lastCommitAt = remaining[remaining.length - 1].ts;
        day.activityWindowMs = remaining.length > 1 ? remaining[remaining.length - 1].ts - remaining[0].ts : 0;
        day.estimatedActivityMs = blocks.reduce((s, b) => s + b.durationMs, 0);
        day.apps = [...new Map(remaining.map((c) => [c.appId, { appId: c.appId, appName: c.appName }])).values()];
        day.blocks = blocks.map((b, i) => ({
          blockIndex: i,
          startTs: b.commits[0].ts,
          endTs: b.commits[b.commits.length - 1].ts,
          durationMs: b.durationMs,
          hasDuration: b.hasDuration,
          commits: b.commits,
        }));
        renderSaasdoDays();
      }

      async function showImportConfirmModal(id) {
        const item = findImportItem(id);
        if (!item) return;
        const isEmail = importView === "email";
        let description = "";
        let metadata = {};
        let durationHours = "";

        if (isEmail) {
          metadata = { to: item.to, snippet: item.snippet };
          description = "";
        } else {
          metadata = { organizer: item.organizer, attendees: item.attendees, allDay: item.allDay };
          description = formatAttendees(item.attendees);
          // Die vereinbarten +5 Minuten betreffen ausschließlich die vorgeschlagene Dauer,
          // niemals das fachliche Enddatum (das bleibt das tatsächliche Terminende).
          const rawHours = (new Date(item.end) - new Date(item.start)) / 3600000;
          durationHours = Math.round((rawHours + 5 / 60) * 4) / 4 || "";
        }

        const endSource = isEmail ? item.sentAt : item.end;
        const endVal = berlinLocalInput(endSource);

        showModal(`
    <div class="modal-title">Als Abrechnungsposition übernehmen</div>
    ${isEmail ? `<div style="font-size:12px;color:var(--muted)">E-Mails haben keine geschätzte Dauer — bitte selbst festlegen.</div>` : ""}

    <button class="btn btn-red btn-sm" onclick="deleteEntry(${entry.id})">Eintrag löschen</button>
    <button class="btn btn-secondary" onclick="closeModal()">Abbrechen</button>
  `);

      async function saveEntry(id, breakIds) {
        const check_in = new Date(
          document.getElementById("editIn").value,
        ).toISOString();
        const check_out = document.getElementById("editOut").value
          ? new Date(document.getElementById("editOut").value).toISOString()
          : null;
        const notes = document.getElementById("editNote").value || null;
        const project_id = document.getElementById("editProject").value || null;
        try {
          await api("PUT", `/time/${id}`, {
            check_in,
            check_out,
            notes,
            project_id,
          });
          for (const bid of breakIds || []) {
            const startVal = document.getElementById(`editBreakStart_${bid}`).value;
            const endVal = document.getElementById(`editBreakEnd_${bid}`).value;
            await api("PUT", `/breaks/${bid}`, {
              start_time: new Date(startVal).toISOString(),
              end_time: endVal ? new Date(endVal).toISOString() : null,
            });
          }
          closeModal();
          loadHistory();
        } catch (e) {
          alert(e.message);
        }
      }

      async function deleteEntry(id) {
        if (!confirm("Eintrag wirklich löschen?")) return;
        await api("DELETE", `/time/${id}`, {});
        closeModal();
        loadHistory();
      }

      // ── Vacation ────────────────────────────────────────────────────
      let vacData = null;
      let googleEvents = [];

      async function loadVacation() {
        showSpinner("vacContent");
        const MONTHS = [
          "Januar",
          "Februar",
          "März",
          "April",
          "Mai",
          "Juni",
          "Juli",
          "August",
          "September",
          "Oktober",
          "November",
          "Dezember",
        ];
        document.getElementById("vacMonthLabel").textContent =
          `${MONTHS[vacMon - 1]} ${vacYear}`;
        vacData = await api("GET", `/absences/${vacYear}`);

        const daysInMonth = new Date(vacYear, vacMon, 0).getDate();
        const from = `${vacYear}-${String(vacMon).padStart(2, "0")}-01`;
        const to = `${vacYear}-${String(vacMon).padStart(2, "0")}-${String(daysInMonth).padStart(2, "0")}`;
        try {
          googleEvents = await api(
            "GET",
            `/google/events?from=${from}&to=${to}`,
          );
        } catch (e) {
          googleEvents = [];
        }

        renderVacation();
      }

      function vacMonth(dir) {
        vacMon += dir;
        if (vacMon > 12) {
          vacMon = 1;
          vacYear++;
        }
        if (vacMon < 1) {
          vacMon = 12;
          vacYear--;
        }
        loadVacation();
      }

      function renderVacation() {
        if (!vacData) return;
        const absMap = {};
        vacData.absences.forEach((a) => (absMap[a.date.split("T")[0]] = a));

        const today = new Date().toISOString().split("T")[0];
        const firstDay = new Date(vacYear, vacMon - 1, 1).getDay();
        const startOffset = (firstDay + 6) % 7; // Mon=0
        const daysInMonth = new Date(vacYear, vacMon, 0).getDate();

        let calHtml = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"]
          .map((d) => `<div class="cal-header">${d}</div>`)
          .join("");
        for (let i = 0; i < startOffset; i++)
          calHtml += `<div class="cal-day empty"></div>`;
        for (let d = 1; d <= daysInMonth; d++) {
          const dateStr = `${vacYear}-${String(vacMon).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
          const abs = absMap[dateStr];
          const dow = new Date(vacYear, vacMon - 1, d).getDay();
          const isWeekend = dow === 0 || dow === 6;
          const cls = [
            "cal-day",
            dateStr === today ? "today" : "",
            abs ? abs.type : "",
            isWeekend && !abs ? "weekend" : "",
          ]
            .filter(Boolean)
            .join(" ");
          const title =
            abs?.type === "holiday" && abs.notes ? ` title="${abs.notes}"` : "";
          calHtml += `<div class="${cls}"${title} onclick="toggleAbsence('${dateStr}')">${d}</div>`;
        }

        const typeLabels = {
          vacation: "🏖️ Urlaub",
          sick: "🤒 Krank",
          holiday: "🎉 Feiertag",
        };

        document.getElementById("vacContent").innerHTML = `
    <div class="card">
      <div class="stat-row">
        <div class="stat-chip"><div class="val">${vacData.vacation_total}</div><div class="lbl">Tage gesamt</div></div>
        <div class="stat-chip"><div class="val negative">${vacData.vacation_taken}</div><div class="lbl">Genommen</div></div>
        <div class="stat-chip"><div class="val positive">${vacData.vacation_remaining}</div><div class="lbl">Verbleibend</div></div>
      </div>
    </div>

    <div class="absence-types">
      ${["vacation", "sick", "holiday"]
        .map(
          (t) =>
            `<div class="absence-chip ${t} ${selectedAbsenceType === t ? "selected" : ""}" onclick="selectAbsenceType('${t}')">${typeLabels[t]}</div>`,
        )
        .join("")}
    </div>

    <div class="calendar-grid">${calHtml}</div>

    <div class="card">
      <div class="card-title">Einträge ${String(vacMon).padStart(2, "0")}/${vacYear}</div>
      ${
        groupConsecutiveAbsences(
          vacData.absences.filter((a) => {
            const d = new Date(a.date);
            return d.getFullYear() === vacYear && d.getMonth() + 1 === vacMon;
          }),
        )
          .map((g) => {
            const fmt = (dt) =>
              dt.toLocaleDateString("de-DE", {
                weekday: "short",
                day: "numeric",
                month: "short",
              });
            const label =
              g.type === "holiday" && g.notes ? "🎉 " + g.notes : typeLabels[g.type];
            const dateLabel =
              g.start.getTime() === g.end.getTime()
                ? fmt(g.start)
                : `${fmt(g.start)} – ${fmt(g.end)}`;
            return `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <div style="flex:1;font-size:14px">${dateLabel} · ${label}</div>
          <button class="btn btn-secondary btn-sm" onclick='deleteAbsenceGroup(${JSON.stringify(g.ids)})'>✕</button>
        </div>
      `;
          })
          .join("") ||
        "<div style='color:var(--muted);font-size:13px'>Keine Einträge</div>"
      }
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem">
        <div class="card-title" style="margin-bottom:0">📅 Kalendertermine</div>
        ${googleEvents.length ? `<button class="btn btn-secondary btn-sm" style="width:auto" onclick="applyAllGoogleEvents()">Alle übernehmen</button>` : ""}
      </div>
      ${
        googleEvents.length
          ? googleEvents
              .map(
                (e) => `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <div style="flex:1;font-size:14px">${fmtDate(e.start)} · ${escapeHtml(e.summary)}</div>
          <button class="btn btn-secondary btn-sm" onclick="applyGoogleEvent('${e.id}')">Übernehmen</button>
        </div>
      `,
              )
              .join("")
          : "<div style='color:var(--muted);font-size:13px'>Keine Termine</div>"
      }
    </div>
  `;
      }

      function datesForGoogleEvent(e) {
        const dates = [];
        if (e.allDay) {
          let d = new Date(e.start);
          const end = new Date(e.end); // Google: end ist exklusiv
          while (d < end) {
            dates.push(d.toISOString().split("T")[0]);
            d.setDate(d.getDate() + 1);
          }
        } else {
          dates.push(e.start.split("T")[0]);
        }
        return dates;
      }

      async function applyGoogleEvent(id) {
        const e = googleEvents.find((x) => x.id === id);
        if (!e) return;
        for (const date of datesForGoogleEvent(e)) {
          await api("POST", "/absences", {
            date,
            type: selectedAbsenceType,
            notes: e.summary,
          });
        }
        vacData = await api("GET", `/absences/${vacYear}`);
        renderVacation();
      }

      async function applyAllGoogleEvents() {
        if (
          !confirm(
            `${googleEvents.length} Termin(e) als Abwesenheit übernehmen?`,
          )
        )
          return;
        for (const e of googleEvents) {
          for (const date of datesForGoogleEvent(e)) {
            await api("POST", "/absences", {
              date,
              type: selectedAbsenceType,
              notes: e.summary,
            });
          }
        }
        vacData = await api("GET", `/absences/${vacYear}`);
        renderVacation();
      }

      function selectAbsenceType(type) {
        selectedAbsenceType = type;
        renderVacation();
      }

      async function toggleAbsence(dateStr) {
        const existing = vacData.absences.find(
          (a) => a.date.split("T")[0] === dateStr,
        );
        if (existing) {
          if (existing.type === selectedAbsenceType) {
            await api("DELETE", `/absences/${existing.id}`, {});
          } else {
            await api("POST", "/absences", {
              date: dateStr,
              type: selectedAbsenceType,
            });
          }
        } else {
          await api("POST", "/absences", {
            date: dateStr,
            type: selectedAbsenceType,
          });
        }
        vacData = await api("GET", `/absences/${vacYear}`);
        renderVacation();
      }

      function groupConsecutiveAbsences(list) {
        const groups = [];
        for (const a of list) {
          const d = new Date(a.date);
          const last = groups[groups.length - 1];
          if (last && last.type === a.type && d - last.end === 86400000) {
            last.end = d;
            last.ids.push(a.id);
          } else {
            groups.push({ type: a.type, notes: a.notes, start: d, end: d, ids: [a.id] });
          }
        }
        return groups;
      }

      async function deleteAbsenceGroup(ids) {
        if (ids.length > 1 && !confirm(`${ids.length} Tage wirklich löschen?`)) return;
        for (const id of ids) {
          await api("DELETE", `/absences/${id}`, {});
        }
        vacData = await api("GET", `/absences/${vacYear}`);
        renderVacation();
      }

      function formatRelativeTime(iso) {
        if (!iso) return "Noch nie synchronisiert";
        const diffMs = Date.now() - new Date(iso).getTime();
        const min = Math.round(diffMs / 60000);
        if (min < 1) return "gerade eben synchronisiert";
        if (min < 60) return `vor ${min} Minute${min !== 1 ? "n" : ""} synchronisiert`;
        const hours = Math.round(min / 60);
        if (hours < 24) return `vor ${hours} Stunde${hours !== 1 ? "n" : ""} synchronisiert`;
        const days = Math.round(hours / 24);
        return `vor ${days} Tag${days !== 1 ? "en" : ""} synchronisiert`;
      }

      <div style="flex:1">
        <div class="project-name">${escapeHtml(p.name)}</div>
        ${p.external_id ? `<div class="project-ext">Auftragsnummer: ${escapeHtml(p.external_id)}</div>` : ""}
      </div>
      <button class="btn btn-secondary btn-sm" style="width:auto" onclick="editProject(${p.id})">✏️</button>
    </div>
  `,
          )
          .join("");
      }

      function showAddProject() {
        showModal(`
    <div class="modal-title">Projekt anlegen</div>
    <div class="form-group"><label>Name</label><input type="text" id="pName" placeholder="Projektname / Kunde" /></div>
    <div class="form-group"><label>Farbe</label><input type="color" id="pColor" value="${DEFAULT_ACCENT}" /></div>
    <div class="form-group"><label>Auftragsnummer (optional)</label><input type="text" id="pExtId" placeholder="z.B. AB-2026-014" /></div>
    <button class="btn btn-primary" onclick="createProject()">Anlegen</button>
    <button class="btn btn-secondary" onclick="closeModal()">Abbrechen</button>
  `);
      }

      async function createProject() {
        const name = document.getElementById("pName").value;
        const color = document.getElementById("pColor").value;
        const external_id = document.getElementById("pExtId").value;
        if (!name) return alert("Name fehlt");
        try {
          await api("POST", "/projects", { name, color, external_id: external_id || undefined });
        } catch (e) {
          return alert(e.message);
        }
        closeModal();
        await loadProjects();
        renderProjects();
      }

      function editProject(id) {
        const p = projects.find((x) => x.id === id);
        if (!p) return;
        showModal(`
    <div class="modal-title">Projekt bearbeiten</div>
    <div class="form-group"><label>Name</label><input type="text" id="epName" value="${escapeHtml(p.name)}" /></div>
    <div class="form-group"><label>Farbe</label><input type="color" id="epColor" value="${p.color}" /></div>
    <div class="form-group"><label>Auftragsnummer</label><input type="text" id="epExtId" value="${escapeHtml(p.external_id || "")}" /></div>
    <button class="btn btn-primary" onclick="updateProject(${p.id})">Speichern</button>
    <button class="btn btn-red btn-sm" onclick="archiveProject(${p.id})">Archivieren</button>
    <button class="btn btn-secondary" onclick="closeModal()">Abbrechen</button>
  `);
      }

      async function updateProject(id) {
        const name = document.getElementById("epName").value;
        const color = document.getElementById("epColor").value;
        const external_id = document.getElementById("epExtId").value;
        try {
          await api("PUT", `/projects/${id}`, { name, color, external_id, active: true });
        } catch (e) {
          return alert(e.message);
        }
        closeModal();
        await loadProjects();
        renderProjects();
      }

      async function archiveProject(id) {
        if (!confirm("Projekt archivieren?")) return;
        await api("DELETE", `/projects/${id}`, {});
        closeModal();
        await loadProjects();
        renderProjects();
      }

      function collectProfileUpdate() {
        return {
          name: document.getElementById("sName").value,
          daily_hours: parseFloat(document.getElementById("sHours").value),
          vacation_days_per_year: parseInt(
            document.getElementById("sVac").value,
          ),
          office_lat: parseFloat(document.getElementById("sLat").value) || null,
          office_lng: parseFloat(document.getElementById("sLng").value) || null,
          office_radius:
            parseInt(document.getElementById("sRadius").value) || 200,
          bundesland: document.getElementById("sBundesland").value || null,
          accent_color: document.getElementById("sAccent").value,
          tracking_start_date:
            document.getElementById("sTrackingStart").value || null,
          saasdo_author: document.getElementById("sSaasdoAuthor").value || null,
        };
      }

      async function saveProfile() {
        try {
          me = await api("PUT", "/auth/me", collectProfileUpdate());
          localStorage.setItem("zt_user", JSON.stringify(me));
          document.getElementById("userChip").textContent =
            me.name.split(" ")[0];
          alert("Gespeichert ✓");
        } catch (e) {
          alert(e.message);
        }
      }

      async function generateHolidays(btn) {
        const originalLabel = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML =
          '<div class="spinner" style="width:16px;height:16px;border-width:2px;margin:0 auto"></div>';
        try {
          me = await api("PUT", "/auth/me", collectProfileUpdate());
          localStorage.setItem("zt_user", JSON.stringify(me));
          const { count } = await api("POST", "/holidays/generate", {});
          alert(`${count} Feiertage angelegt ✓`);
        } catch (e) {
          alert(e.message);
        } finally {
          btn.disabled = false;
          btn.innerHTML = originalLabel;
        }
      }

      async function geocodeAddress() {
        const address = document.getElementById("sAddress").value.trim();
        const resultEl = document.getElementById("geocodeResult");
        if (!address) return alert("Bitte Adresse eingeben");
        resultEl.textContent = "Suche...";
        try {
          const { lat, lng, display_name } = await api(
            "GET",
            `/geocode?q=${encodeURIComponent(address)}`,
          );
          document.getElementById("sLat").value = lat.toFixed(7);
          document.getElementById("sLng").value = lng.toFixed(7);
          resultEl.textContent = "✓ " + display_name;
        } catch (e) {
          resultEl.textContent = "";
          alert(e.message);
        }
      }

      async function connectGoogle() {
        try {
          const { url } = await api("GET", "/google/connect");
          window.location.href = url;
        } catch (e) {
          alert(e.message);
        }
      }

      async function disconnectGoogle() {
        if (!confirm("Google Kalender trennen?")) return;
        await api("POST", "/google/disconnect", {});
        me.google_connected = false;
        localStorage.setItem("zt_user", JSON.stringify(me));
        renderSettings();
      }

      function useCurrentLocation() {
        if (!navigator.geolocation) return alert("Geolocation nicht verfügbar");
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            document.getElementById("sLat").value =
              pos.coords.latitude.toFixed(7);
            document.getElementById("sLng").value =
              pos.coords.longitude.toFixed(7);
          },
          () => alert("Standort nicht verfügbar"),
        );
      }

      async function changePassword() {
        const current_password = document.getElementById("sPwCur").value;
        const new_password = document.getElementById("sPwNew").value;
        try {
          await api("PUT", "/auth/password", {
            current_password,
            new_password,
          });
          alert("Passwort geändert ✓");
          document.getElementById("sPwCur").value = "";
          document.getElementById("sPwNew").value = "";
        } catch (e) {
          alert(e.message);
        }
      }

      // ── Admin ────────────────────────────────────────────────────────
      let adminUsers = [];
      async function loadAdmin() {
        showSpinner("adminContent");
        adminUsers = await api("GET", "/admin/users");
        document.getElementById("adminContent").innerHTML = `
    <div class="section-title">Alle Benutzer</div>
    ${adminUsers
      .map(
        (u) => `
      <div class="card" style="display:flex;flex-direction:column;gap:.5rem;margin-bottom:.5rem">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="flex:1">
            <div style="font-weight:700">${escapeHtml(u.name)}</div>
            <div style="font-size:12px;color:var(--muted)">${escapeHtml(u.email)} · ${u.role}</div>
          </div>
          <button class="btn btn-secondary btn-sm" onclick="editUser(${u.id})">✏️</button>
        </div>
        <div style="font-size:12px;color:var(--muted)">${u.daily_hours}h/Tag · ${u.vacation_days_per_year} Urlaubstage</div>
      </div>
    `,
      )
      .join("")}
  `;
      }

      function editUser(id) {
        const u = adminUsers.find((x) => x.id === id);
        if (!u) return;
        showModal(`
    <div class="modal-title">${escapeHtml(u.name)} bearbeiten</div>
    <div class="form-group"><label>Name</label><input type="text" id="auName" value="${escapeHtml(u.name)}" /></div>
    <div class="form-group"><label>Rolle</label>
      <select id="auRole">
        <option value="user" ${u.role === "user" ? "selected" : ""}>user</option>
        <option value="admin" ${u.role === "admin" ? "selected" : ""}>admin</option>
      </select>
    </div>
    <div class="form-group"><label>Sollstunden/Tag</label><input type="number" id="auHours" value="${u.daily_hours}" step="0.5" /></div>
    <div class="form-group"><label>Urlaubstage/Jahr</label><input type="number" id="auVac" value="${u.vacation_days_per_year}" /></div>
    <button class="btn btn-primary" onclick="updateUser(${u.id})">Speichern</button>
    ${u.id !== me.id ? `<button class="btn btn-red btn-sm" onclick="deleteUser(${u.id})">Benutzer löschen</button>` : ""}
    <button class="btn btn-secondary" onclick="closeModal()">Abbrechen</button>
  `);
      }

      async function updateUser(id) {
        const body = {
          name: document.getElementById("auName").value,
          role: document.getElementById("auRole").value,
          daily_hours: parseFloat(document.getElementById("auHours").value),
          vacation_days_per_year: parseInt(
            document.getElementById("auVac").value,
          ),
        };
        await api("PUT", `/admin/users/${id}`, body);
        closeModal();
        loadAdmin();
      }

      async function deleteUser(id) {
        if (!confirm("Benutzer wirklich löschen? Alle Daten werden entfernt."))
          return;
        await api("DELETE", `/admin/users/${id}`, {});
        closeModal();
        loadAdmin();
      }

      // ── Modal ────────────────────────────────────────────────────────
      function showModal(html) {
        document.getElementById("modalInner").innerHTML = html;
        document.getElementById("modal").style.display = "flex";
      }
      function closeModal(e) {
        if (e && e.target !== document.getElementById("modal")) return;
        document.getElementById("modal").style.display = "none";
      }

      // ── Keyboard ─────────────────────────────────────────────────────
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          if (document.getElementById("loginForm").style.display !== "none")
            doLogin();
          else if (
            document.getElementById("registerForm").style.display !== "none"
          )
            doRegister();
        }
        if (e.key === "Escape") closeModal();
      });

      // ── Init ─────────────────────────────────────────────────────────
      if (token && me) bootApp();
    </script>
  </body>
</html>
